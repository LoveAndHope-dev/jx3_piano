              proposal: "方案：1) 控制面板标题行只保留「🎛️
                控制面板」，在其下方新增一行依次放置「简单模式（可切换）」「亮色/深色」「置顶」「向导」，全部小号按钮；移除标题行与导入按钮行\
                中的旧位置。2) 左侧面板宽度 350→438（+25%），splitter 初始比例同步；新增
                app/ui/widgets.py：AntCheckBox 自绘 14px 圆角方框与白色勾选折线，颜色读取
                theme.current_tokens()，主题切换时统一刷新；MarqueeLabel 在文字超出宽度且鼠标悬停时每
                40ms 左移 1px，到末尾（宽度+40px）停顿 1s 后回到 0
                循环，移出停止并复位到从头显示；列表行改为「AntCheckBox + MarqueeLabel」。3) 简单模式：新增
                simple_mode 状态与切换按钮。进入时停止播放、丢弃未保存标记（不保存）、清空铺面 notes
                与历史基线、从标签栏移除「铺面编辑」页、映射下拉固定 Z/7 且绝对音域固定 C2/B5（黄色框
                36–83）并禁用映射下拉、显示「▶️ 播放」按钮；退出时隐藏播放按钮、重新插入标签页、恢复映射控件，并根据
                current_midi_path 重新加载原始 MIDI（覆盖优化后的资产）。4) 简单播放
                on_simple_play_clicked：若正在播放则提示返回；解析当前曲目路径；用 MidiToKeysConverter
                重新读取原始 MIDI 音符并 set_notes；固定映射与音域；调用新增的
                PianoRollCanvas.arpeggiate_all（临时全选后复用
                arpeggiate_selected，再恢复选择）对全部音符做 1/32 拍优化；调用
                _save_current_play_assets 保存优化后的 edited MIDI 与 play_code
                JSON，清未保存标记与历史基线；最后 start_playing 读取 JSON 播放；每次点击都从原始 MIDI
                重新开始，避免叠加优化。5) 亮色框线：central_widget 设置 objectName
                centralWidget，QSS 用 colorBgBase
                作为背景；QFrame#leftPanel/rightPanel、QGroupBox、QFrame#controlPanel
                边框统一改为 colorBorder（亮色 #d9d9d9、深色 #424242）；apply_theme 后刷新所有
                AntCheckBox。6)
                向导新增「简单模式」「正常模式」两个独立小节，并补更新按钮行、勾选与悬停滚动、简单播放说明。关键取舍：不用 QSS
                图片资源实现勾选（打包路径复杂，改为自绘）；简单模式不缓存优化结果（重复点击会叠加，改为每次重读原始
                MIDI）；不保留编辑标签只禁用（用户要求标签消失）。风险：简单模式会静默丢弃未保存修改（用户已确认）；每次简单播放多一次
                MIDI 解析；自绘控件需跟随主题重绘；亮色边框统一后深色主题边框会更明显。测试策略：控制面板四按钮同一行、左栏宽度
                438；勾选状态与悬停滚动启停；简单模式隐藏/恢复标签、清空铺面、固定 Z/7 与
                C2/B5、简单播放调用优化+保存+播放、重复点击幂等、退出重载原始 MIDI；亮色 centralWidget 背景与边框使用
                colorBorder；向导包含简单/正常小节；既有 234 项回归。Spec Patch：无。"
