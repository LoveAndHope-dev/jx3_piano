  summary:
    text: 定位并修复了拖动黄色音域框跨越 B-C、E-F 处会跳过一个自然键位的 bug。根因：piano_roll.py 的 mouseMoveEvent
      中 range 拖动分支原先按原始 MIDI 半音距离换算鼠标位移（row_delta =
      round(dy/ROW_HEIGHT)，target_low_pitch = 起始低边界音高 - row_delta），再用
      _nearest_ladder_index_for_pitch 找最近自然键。由于键位序列里绝大多数相邻自然键相差 2
      个半音（中间隔一个黑键），只有 B-C、E-F 相差 1 个半音，nearest 取整会让 B、C、E、F
      各自的可命中像素窗口只有正常键位的一半（约 10px vs 20px），且用整数 row_delta 逐级步进时，某些整数半音目标（如本例中的
      F）永远不会被 round(dy/10) 命中，导致该键在任何拖动速度下都会被确定性跳过（不是概率性的事件合并问题）。用纯 Python
      脚本复现：从 D4 开始逐 px 模拟旧算法，dy 0~60 范围内 W→Q→J→H→G 的转换序列中 F
      完全没有出现过，证实其被跳过；同样脚本换成修复后算法得到
      W→Q→J→H→G→F→D，六个键位全部出现且窗口宽度均匀。修复方式：改为在键位序列（ladder）索引空间里计算拖动增量，而不是原始半音空间——mousePressEvent
      记录起始低边界对应的 ladder 索引（新增 self._drag_range_start_low_idx，替换原来存储原始音高的
      self._drag_range_start_low），mouseMoveEvent 里 idx_delta =
      round(dy/ROW_HEIGHT) 直接作用于该 ladder 索引（new_low_idx = start_low_idx -
      idx_delta），再按原有逻辑 clamp 到 [0, len(ladder)-1-span_idx] 并算出 new_high_idx =
      new_low_idx + span_idx。这样每个自然键（不论是否与黑键相邻）在拖动方向上都获得完全相等的命中窗口，彻底消除了 B-C/E-F
      处的窄窗口问题，同时不影响其余任何逻辑：跨度(span_idx)计算、框体几何绘制(_update_range_item_geometry/_pitch_to_y)、下拉框与框体解耦、播放时的移调与
      ±1
      半音扩展筛选（regenerate_playback_from_notes）均未改动，_nearest_ladder_index_for_pitch
      仍用于 mousePressEvent 里根据当前音高求起始 ladder 索引（未被拖动逻辑复用，语义未变）。
