  summary:
    text: 修复独立 Verifier 发现的 A8 真实缺陷：铺面中新增音符此前硬编码 track=0，当自动选中的 processed_tracks 不包含
      0（常见于 track0 是纯 tempo/meta 音轨、track1+ 才是旋律的多音轨 MIDI）时，write_notes_to_midi
      按 processed_tracks 分组写回，导致这些新增音符在另存为 MIDI 时被静默丢弃。修复分两处：(1) piano_roll.py
      新增 set_default_track(track_idx)，由 gui.py 在加载曲目时传入
      processed_tracks[0]，新增音符使用该音轨号而不是硬编码 0；(2) write_notes_to_midi 增加防御性兜底——任何
      track 字段不在 processed_tracks 内的音符统一归入
      processed_tracks[0]，不再静默丢弃（覆盖新增音符默认音轨以外的其它潜在来源）。已用 Verifier
      报告的确切复现场景（tempo 音轨在 track0、旋律在
      track1、processed_tracks=[1]）复现问题、验证修复：通过真实鼠标点击新增音符、保存、重新解析新文件，确认音符数量与铺面显示一致，不再丢失。三处前一轮的纯
      UI 调整（音域框颜色、播放/保存按钮位置、Tab与下拉框深色样式）未再改动。
    truncated: false
