            main（脚本零改动最直接）；不保留 release 副本（避免两份权威版本）。风险：tick 量化约
            1ms；结束时间不变导致后移音符变短、同音高同起点被去重（均为脚本既定语义，旧测试需重写）；打包需确认 mido
            与脚本被收集。测试策略：runner
            单测覆盖和弦展开、结束时间不变、未选中不变、重复音符移除、无效拍长返回副本；断言根目录脚本保留原脚本标志内容且不含旧实现；GUI
            测试覆盖无选中提示、异常不改铺面、撤销可恢复；布局测试覆盖两行贴左与末尾弹性、置顶按钮在控制面板标题行且日志页不存在；既有 157
            项回归。Spec Patch：无。
