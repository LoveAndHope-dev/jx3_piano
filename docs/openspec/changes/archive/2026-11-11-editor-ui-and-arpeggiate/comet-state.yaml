                handoffHash: cab66033e1023f0f0a86b5b001265b7ed83a191a0f2b4b6086ed6160addcb9da
                proposal: 方案：1) 新增内存版 arpeggiate.py：arpeggiate_notes(notes, selected_ids,
                  seconds_per_beat)，窗口与步长均为 seconds_per_beat/32；选中音符按 start
                  排序、以组首为锚点把 start < 锚点+窗口 的音符归组并做级联扩展，组内按 pitch 升序设
                  start=锚点+k*步长；结束时间不变，若时长小于 MIN_NOTE_DURATION=0.05 则把 start 钳到
                  end-0.05；未选中原样返回副本且不修改输入。2) 画布新增
                  arpeggiate_selected(seconds_per_beat) 并透传：替换
                  _notes、重排图元、扩展场景、发 notesChanged；GUI 在工具栏上方动作行放「🪄 曲谱优化」按钮（带
                  tooltip），无选中时写日志提示，编辑模式可用、播放中禁用，拍长按 (60/BPM)*(4/分母) 计算。3)
                  _sync_roll_mode 增加 play_btn.setEnabled(play_mode or
                  is_playing)，编辑模式禁用弹奏、演奏模式启用、播放中保持停止按钮可用。4) 播放列表刷新改为
                  setItemWidget(row)：QLabel(名称)+行末🗑按钮，按钮回调传该条目删除；移除右侧旧删除按钮与启用逻辑；条目仍保存路径与原始文件名到
                  UserRole/UserRole+1。5) 工具栏改 QVBoxLayout
                  三行：动作行、第一行（标题/未保存/弹奏/保存/模式/演奏最低键位映射/演奏最高键位映射）、第二行（钢琴音域绝对最低键/绝对最高键/量化/BPM）；文案按需求更新。6)
                  QDoubleSpinBox 增加与 QComboBox 一致的深色 QSS（背景、边框、圆角、文字、focus）。7)
                  默认映射 Z(36)/7(83)；黄框默认范围
                  set_instrument_range(36,47)，与映射下拉解耦，切曲时同样重置。关键取舍：不直接子进程调用外部脚本（慢且无法只作用于选中音符）；行删除不做委托绘制（事件命中更复杂）；黄框不继续跟随映射（与需求冲突）。风险：逐行删除误触（确认框+文件保留+可恢复）、琶音最小时长与结束时间冲突（钳起点）、窄窗口两行布局挤压。测试策略：test_arpeggiate
                  覆盖和弦展开、单音、两组独立、结束时间不变、过短钳制、未选中不变、输入不变；画布与 GUI 测试覆盖
                  arpeggiate_selected 与
                  notesChanged、编辑模式弹奏禁用/演奏模式启用；手动验收文案、两行布局、BPM 样式、默认 Z/7、黄框
                  C2-B2、逐行删除、按钮 tooltip；既有 114 项回归。Spec Patch：无。
                requirementsEvidence:
                  contentHash: 4dc0a696b75676f694a8555b28513861c421c9bcc8185ef38c4e6a46415828b8
