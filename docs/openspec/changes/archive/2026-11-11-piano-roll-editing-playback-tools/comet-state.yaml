            handoffHash: e63a1d81277d3af1b6f43d9cf2b0b52c6f2bd89a7e774e6b51aebd76ea80dfb1
            proposal: 方案（8 项决策）：1) 横向缩放把模块级 PIXELS_PER_SECOND 改为画布实例值 _pixels_per_second（默认
              70，夹紧 10～600），坐标换算统一走 _time_to_x 与 _x_to_time；Shift+滚轮以鼠标时间点为锚，调整
              horizontalScrollBar 使锚点时间停留在同一屏幕位置，缩放后重建背景、重排音符/音域框/播放线并刷新标尺。2)
              顶部新增独立 _TimeRulerWidget（约 28px），与小节线共用同一时间换算，订阅横向滚动、缩放与 resize
              重绘；小节序号从 1 起，小节内按拍画短刻度，缺少 BPM/拍号时退化为秒标注；点击或拖动发出
              playheadRequested(seconds) 信号。3) 播放辅助线拆为锚点
              _playhead_anchor_seconds（默认 0，切曲归零）与显示位置
              _playhead_display_seconds；set_playhead(None)
              回落到锚点而不再隐藏；只读（播放中）时标尺忽略鼠标事件。4) 剪贴板为画布内部深拷贝列表：Ctrl+C 快照，Ctrl+X 复用
              _delete_selected 删除，Ctrl+V 以剪贴板最早 start 对齐锚点、生成新 id、重算
              mapped、选中新音符并发出 notesChanged。5) Shift+上/下逐音符移动 ±12
              半音，越界音符跳过，起始时间与时长不变。6) 播放起点在 gui.start_playing 过滤起始时间不早于 playhead
              的音符（1e-6 容差）并平移为相对时间，复用 regenerate_playback_from_notes；进度回调为
              playhead+elapsed；过滤后为空则提示且不播放；不改 player.py 与播放数据格式。7) 空闲状态播放按钮文案 3
              处改为「▶️ 弹奏」，播放中「⏹️ 停止(ESC)」与 objectName 不变。8) 新增
              set_beat_grid(seconds_per_beat, beats_per_measure)，由
              gui._load_piano_roll 传入标尺所需的拍长与每小节拍数。关键取舍：不用
              QGraphicsView.scale（会同时缩放行高与文字，破坏 1 行=1 半音）；不用 drawForeground
              画标尺（属场景坐标，会随纵向滚动移动）；不用 QHeaderView（本视图非表格模型）；不用系统剪贴板（Clipboard
              只需编辑器内使用）；不在 player.py 内 seek（播放数据无时间戳）。风险：缩放全量重排的性能；标尺与滚动条对齐依赖
              valueChanged/rangeChanged/resize 三个事件；浮点边界用 1e-6 容差；无 GUI
              自动化测试，故把粘贴偏移、八度越界、播放起点过滤、缩放锚点抽为纯函数用 unittest 覆盖，交互手动验收；播放中
              ensureVisible 与手动滚动冲突保留现状。Spec Patch：无，现有 3 份 delta spec
              已覆盖全部已确认行为。
