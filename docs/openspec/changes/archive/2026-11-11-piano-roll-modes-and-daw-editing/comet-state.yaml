                proposal: 方案：1) 模式复用画布只读开关：on_range_toggle_clicked 中 黄框可见等于演奏模式，调用
                  set_instrument_range_visible(True) 与
                  set_read_only(True)；编辑模式隐藏黄框并
                  set_read_only(self.is_playing)（播放中保持只读）；按钮文案按点击后进入的模式显示「🎹
                  演奏模式 / ✏️ 编辑模式」。2) 标尺定位与只读解耦：新增
                  PianoRollWidget.set_playhead_locked(bool)，播放开始/结束时设置；标尺改用它判断是否响应鼠标，演奏模式下仍可点击/拖动定位辅助线。3)
                  空白区域：mousePressEvent 只记录起点进入
                  select-rect-or-create，不预建音符；mouseReleaseEvent 未拖动则清空选择；新增
                  mouseDoubleClickEvent 在双击位置新建音符并选中；拖动仍框选。4) 左边缘调整：命中判定新增
                  near_left_edge（不与右边缘同时命中，优先右边缘），新增 resize-start
                  模式，新起点=吸附后时间并钳制到 [0, end-MIN_NOTE_DURATION]，结束时间不变。5) 方向键：←/→
                  平移选中组，步长取 _quantize_seconds（关闭时
                  DEFAULT_NUDGE_SECONDS=0.1），起点钳制不小于 0；↑/↓ 复用八度函数做 ±1
                  半音，越界跳过；Shift+↑/↓ 仍为 ±12；无选中直接返回。6) wheelEvent 用
                  ControlModifier 触发缩放，保留 angleDelta().y()==0
                  不缩放保护，其余锚点与重排逻辑不变。7) 全局 QSS 增加 QPushButton 固定高度 26px
                  与下拉框一致；页脚改为 created by 66maer updated by
                  Loveanope_Dev。关键取舍：不新增独立 mode 字段（与 _read_only
                  重复）；不用单击延迟定时器区分双击（Qt
                  已有双击事件）；短音符左右边缘重叠时固定优先右边缘。风险：播放中切回编辑模式需保持只读（用 is_playing
                  判断）；双击前的单击可能造成选择闪烁（双击路径先创建并选中）；方向键要求画布有焦点。测试策略：offscreen UI
                  测试覆盖单击/双击/拖动、左边缘拖动与最小时长、方向键步长与半音/八度、Ctrl 与 Shift
                  滚轮、演奏模式下点击拖动键盘不改数据且标尺可定位；既有 99 项回归（缩放测试改为
                  Ctrl）；按钮高度与页脚人工验收。Spec Patch：无。
