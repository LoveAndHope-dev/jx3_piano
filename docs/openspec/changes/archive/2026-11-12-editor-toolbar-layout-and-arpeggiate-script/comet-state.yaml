          arpeggiate.py（替换旧重写实现），删除原件，用哈希核对逐字节一致。4) 新增 arpeggiate_runner.py，公开
          arpeggiate_notes(notes, selected_ids, seconds_per_beat)：在临时目录生成
          ticks_per_beat=480 的 MIDI，每个选中音符一条独立音轨（起点/时值按秒换算 tick），用
          contextlib.redirect_stdout/redirect_stderr 包住
          arpeggiate.main(src,dst)（windowed 打包下 stdout 为 None），再用脚本自带
          extract_notes 逐轨回读：空轨表示该音符被去重移除，否则按 on/off
          换算回秒；保持原顺序返回，临时目录自动清理，异常原样抛出。5) piano_roll.arpeggiate_selected 改为调用
