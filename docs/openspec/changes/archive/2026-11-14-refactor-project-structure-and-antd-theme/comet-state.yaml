                handoffHash: e480ed50d692c6808bf41241991c47e10bc609f66e6ecb5611180d2a345089db
                proposal: "方案：1) 保留 gui.py / piano_roll.py / build_music.py 作为薄门面，只做 re-export
                  并保留测试会替换的模块级名字（QPushButton、QMessageBox、get_midi_dir_path
                  等），实现移到新包，导入路径与公开类名零改动，188 项测试与 build_exe.py 不需要修改。2) gui 按职责拆
                  mixin：app/main_window.py 只保留状态初始化、装配与
                  closeEvent；app/ui/theme.py
                  提供令牌与样式生成；app/ui/piano_page.py（铺面页装配、加载、BPM、量化、音域、曲谱优化、保存）、pl\
                  aylist_page.py（搜索/排序/列表行/导入/新建/删除/选中）、log_page.py（日志与置顶）；app/\
                  history.py（快照/撤销/前进/未保存）、app/playback.py（开始/停止/进度/完成与线程生命周期）；\
                  app/workers/（PlayThread、BatchConversionWorker）。选择 mixin
                  而非纯组合，因为窗口 API 被测试和信号广泛使用，纯组合需要数百处转发，回归风险与收益不匹配。3) piano_roll
                  拆包：geometry.py（时间/像素换算、缩放、音符数学等纯函数）、painting.py（绘制辅助）、canvas.\
                  py（状态、交互、剪贴板、信号）、ruler.py、widget.py；__init__.py re-export。4)
                  music
                  拆包：mapping.py（键位阶梯/映射/音名/移调）、midi_io.py（extract_notes/write_n\
                  otes_to_midi）、analysis.py（文件分析/速度拍号/自动选轨）、playback.py（播放数据与代码\
                  生成）、converter.py（MidiToKeysConverter
                  薄委托，公开方法不变）、cli.py；build_music.py 门面保留 __main__。5) antd
                  深色令牌：colorPrimary #1677ff、colorBgBase #141414、colorBgContainer
                  #1f1f1f、colorBorder #424242、三级文字色、成功/警告/错误色、间距 4/8/12/16/24、圆角
                  2/4/6/8、字号 12/14/16/20、controlHeight
                  32；build_stylesheet(tokens) 生成全局 QSS，统一按钮/输入/下拉 32px 高 6px
                  圆角、卡片式分组 1px 边框 8px 圆角 16px 内边距、下划线标签页、8px 滚动条；铺面画布语义色保留在
                  piano_roll。6) 分六步迁移并每步全量测试：主题 → workers/history → ui 页面 →
                  piano_roll 包 → music 包 →
                  视觉复查与打包。关键取舍：不做完全组合式重构；不重排功能位置；不改浅色主题；不做差量重写。风险：mixin 仍共享
                  self、导入循环（从具体模块导入避免）、PyInstaller 漏收新包（必要时 hidden-import）、QSS
                  选择器变化（保留 objectName）、深色对比度（offscreen 截图核对）。测试策略：既有 188
                  项回归；新增结构冒烟（公开导入与名称、单文件行数）、主题令牌完整性与 QSS 含主色且不含旧主色
                  #3498DB；打包后启动冒烟。Spec Patch：无。"
