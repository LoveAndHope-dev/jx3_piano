              handoffHash: a151ce48880baa65186f9d8a83b8b717fb5f746836f344632861b84df9fbddc7
              proposal: "方案：1) 工具栏改为三行：第一行标题靠左 + 演奏/编辑模式按钮靠右（addStretch
                吸收）；第二行合并主按钮、曲谱优化、未保存标记靠左，量化与 BPM
                靠右；第三行最低映射、最高映射、绝对最低、绝对最高依次靠左。标题 16px/600，分组间距 12。2) 保存与弹奏合并到
                self.play_btn（保留属性名兼容测试），新增 _update_primary_btn() 按「演奏模式 +
                播放中」计算文案（保存/演奏/停止）、objectName（primaryBtn/stopBtn）与可用状态；编辑模式点击调用
                save_piano_roll，演奏模式调用 toggle_play；删除 piano_save_btn
                并把历史/列表/加载中的 setEnabled 改为 _update_primary_btn，播放回调也统一调用它。3)
                行高从模块常量改为画布实例 _row_height（默认 10，夹紧 6–24），新增
                set_row_height(value, anchor)；Shift+滚轮按 1.25
                倍缩放，以鼠标所在音高为锚点，缩放后调整纵向滚动使该音高留在原视口位置；键盘与背景随行高重绘，场景高度同步，缩放不触发
                notesChanged。4) 播放纵向聚焦：新增 focus_vertical_range_center()，在
                set_playhead_locked(True)
                时调用一次，把黄色音域框上下边界中点滚到视口中心；播放过程不持续强制，停止不改变滚动。5) 主题：theme.py 提供
                DARK_TOKENS/LIGHT_TOKENS（浅色：页面 #f5f5f5、容器 #ffffff、边框 #d9d9d9、文字
                rgba(0,0,0,0.88)），主窗口
                apply_theme/toggle_theme，控制面板标题行在置顶按钮左侧新增主题按钮（深色时显示☀️亮色，浅色时显示🌙\
                深色），仅会话内记忆。关键取舍：合并按钮改变播放入口（编辑模式不再直接播放，用户确认）；不持续强制纵向居中以避免妨碍手动滚动；\
                不做主题持久化。风险：合并按钮需同步所有状态更新点；行高变化影响场景/背景/键盘/命中测试；旧测试需按新结构更新；浅色下画布语\
                义色对比度需截图核对。测试策略：工具栏三行结构与左右分组、按钮文案/可用态随模式与脏标记变化、编辑模式点击调用保存；set_r\
                ow_height 夹紧、Shift+滚轮缩放与锚点、缩放不触发
                notesChanged；播放开始时黄框居中、停止后滚动不变；水平滚动后键盘几何不变；深浅令牌切换与按钮文案；既有 200
                项回归。Spec Patch：无。"
