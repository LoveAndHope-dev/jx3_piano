              full.design.handoff:
                handoffContext: docs/openspec/changes/playlist-search-add-remove/.comet/handoff/design-context.json
                handoffHash: 55f81a00da15b6cbde727baff644b10019830ef96b7afd97512560800b43fe2a
                proposal: 方案：1) 新增 playlist_store.py 数据层，提供
                  load_hidden/save_hidden（midi/.hidden_playlist.json，损坏按空集合并保留原文件）、list_entries（只收
                  .mid/.midi，返回
                  name/path/mtime）、filter_entries（文件名子串且大小写不敏感）、sort_entries（name
                  升序；mtime 从新到旧，同秒用 name
                  作第二键）、unique_midi_name（新建曲目.mid、新建曲目_2.mid…）、create_blank_midi（mido
                  写 set_tempo 120、time_signature 4/4 与空音轨）。2) UI：列表上方搜索
                  QLineEdit 与排序 QComboBox（名称/导入时间），列表改为 QListWidget
                  加右侧竖排删除按钮；控制面板按钮行改为 导入MIDI / 新建 / 刷新。3) refresh_play_list
                  统一管线：读隐藏集合→过滤隐藏→应用搜索→应用排序→重建列表→按路径恢复选中；搜索或排序变化直接调用它，避免两份过滤逻辑。4)
                  删除：无选中时按钮禁用；QMessageBox 二次确认，取消不改状态；确认后写隐藏记录并刷新；若删除的是
                  current_midi_path，调用新增 _clear_piano_roll_cache()（正在播放先
                  stop_playing，清空铺面音符与辅助线，重置
                  current_midi_path/processed_tracks/current_bpm 与 BPM
                  框，清未保存标记与保存按钮，切回占位页）。5) 新建：生成文件后刷新列表，按路径选中并复用 _load_piano_roll
                  加载，从而 BPM 回填与铺面重置沿用现有逻辑；失败只提示。6)
                  恢复：列表右键菜单「恢复所有已移除曲目」清空隐藏记录并刷新。关键取舍：不直接删磁盘文件（破坏用户数据且刷新后无法保持移除）、隐藏记录按文件名而非绝对路径（移动目录仍有效）、不引入独立
                  playlist.json
                  维护列表（需迁移现有目录数据）。风险：同名文件仍隐藏（提供恢复入口并声明限制）、删除当前曲目丢失未保存编辑（确认框合并提示）、mtime
                  同秒排序不稳定（名称作第二键）、搜索与排序不持久化（本次范围外）。测试策略：playlist_store
                  单测覆盖隐藏记录读写与损坏容错、过滤大小写与中文、排序含同秒稳定性、连续新建不重名、空 MIDI 读回
                  tempo/拍号/音轨；UI 交互手动验收；既有 78 项测试回归。Spec Patch：无。
                requirementsEvidence:
                  contentHash: 0891c8b4334b704655e26a814800db5b829e168323ab3e75b5670532c7742241
                  ref: docs/openspec/changes/playlist-search-add-remove
