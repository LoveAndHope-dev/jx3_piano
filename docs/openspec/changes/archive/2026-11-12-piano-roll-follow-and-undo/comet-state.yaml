              proposal: 方案：1) 历史放在 GUI：维护 undo/redo 两个栈，每项快照包含 notes 深拷贝、current_bpm、拍号 (n,d)
                与播放辅助线位置；上限 50 步。初始加载后记录基线快照，用于判断未保存标记。2)
                记录时机：`on_piano_roll_notes_changed` 在非应用状态时把当前状态压入 undo、清空
                redo；应用快照时设置 _history_applying 抑制记录，避免撤销自身入栈。BPM 变更会触发
                notesChanged（rescale_times），因此自动入栈。3) 应用快照：set_notes、恢复
                current_bpm/拍号、重建 set_measure_grid/set_beat_grid
                与量化网格、恢复辅助线锚点，比较当前与基线更新未保存标记与保存按钮。4) 画布只发信号：Ctrl+Z 发
                undoRequested，Ctrl+Shift+Z 发
                redoRequested，_read_only（演奏模式/播放中）直接返回；PianoRollWidget 透传，GUI
                连接处理，不注册全局快捷键。5) 播放跟随：画布新增 follow_playhead()，读取辅助线在视口的 x，超过视口宽度
                80% 时把横向滚动值设为 辅助线像素 − 视口宽度*0.2 并夹紧；set_playhead
                仅在播放（_read_only）时调用，停止后不滚动。关键取舍：不采用差量命令栈（实现面大，50
                步快照足够）；历史不放画布（无法同步 BPM/网格）；不居中锁定（用户已选翻页式）。风险：快照内存随曲目大小增长（50
                步上限，后续可换差量）；撤销不恢复选中集合（规格未要求）；播放中禁用撤销避免音画不同步；阈值 80/20
                为经验值。测试策略：offscreen UI 测试覆盖撤销删除/移动、前进、演奏模式忽略、50 步上限、新操作清空
                redo、撤销恢复 BPM 与辅助线与未保存标记、翻页阈值内不滚动/超过阈值滚动/停止不跟随；既有 141 项回归。Spec
                Patch：无。
