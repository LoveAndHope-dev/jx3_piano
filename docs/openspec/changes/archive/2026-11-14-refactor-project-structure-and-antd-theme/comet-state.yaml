        sequence: 6
        status: resolved
        proposal:
          input:
            change: refactor-project-structure-and-antd-theme
            changeDir: docs/openspec/changes/refactor-project-structure-and-antd-theme
            workspaceBaseline:
              ref: c710eefc-c31b-4357-8126-2f6a51fb7513
