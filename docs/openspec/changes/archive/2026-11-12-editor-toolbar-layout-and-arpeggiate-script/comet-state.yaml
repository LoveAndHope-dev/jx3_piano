            proposal: 方案：1) 工具栏保留两行，删除第一行中段 addStretch()，改在行尾追加 stretch：控件按 sizeHint
              从容器左边缘依次排列，多余宽度由行尾空白吸收，窗口变宽不会把保存/演奏模式/键位映射推走，也不用 setGeometry
              写死坐标（避免 DPI 变化重叠）。2) 控制面板由 QGroupBox 改为 QFrame（objectName
              controlPanel），内部依次为标题行（QLabel panelTitle + stretch +
              置顶按钮）、导入/新建/刷新按钮行、作者信息；QSS
              复用原分组框边框与渐变标题底；从操作日志标题行移除置顶按钮，toggle_topmost 不变。3) 将
              release/谱子/arpeggiate.py 以二进制方式复制为项目根
              arpeggiate.py（替换旧重写实现），删除原件，用哈希核对逐字节一致。4) 新增
              arpeggiate_runner.py，公开 arpeggiate_notes(notes, selected_ids,
              seconds_per_beat)：在临时目录生成 ticks_per_beat=480 的
              MIDI，每个选中音符一条独立音轨（起点/时值按秒换算 tick），用
              contextlib.redirect_stdout/redirect_stderr 包住
              arpeggiate.main(src,dst)（windowed 打包下 stdout 为 None），再用脚本自带
              extract_notes 逐轨回读：空轨表示该音符被去重移除，否则按 on/off
              换算回秒；保持原顺序返回，临时目录自动清理，异常原样抛出。5) piano_roll.arpeggiate_selected
              改为调用 runner，保留变化计数、图形重建、场景扩展与 notesChanged；GUI 传
              60/current_bpm（四分音符拍长），捕获脚本异常写日志且不改铺面。关键取舍：不采用绝对坐标（DPI/字体变化会重叠）；不合并成一行（控件过多）；不调用脚本内部函数而直接跑
              main（脚本零改动最直接）；不保留 release 副本（避免两份权威版本）。风险：tick 量化约
              1ms；结束时间不变导致后移音符变短、同音高同起点被去重（均为脚本既定语义，旧测试需重写）；打包需确认 mido
              与脚本被收集。测试策略：runner
              单测覆盖和弦展开、结束时间不变、未选中不变、重复音符移除、无效拍长返回副本；断言根目录脚本保留原脚本标志内容且不含旧实现；GUI
              测试覆盖无选中提示、异常不改铺面、撤销可恢复；布局测试覆盖两行贴左与末尾弹性、置顶按钮在控制面板标题行且日志页不存在；既有 157
              项回归。Spec Patch：无。
