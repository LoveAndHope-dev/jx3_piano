acceptance:
  - id: A1
    source: brief.md
    text: "A1: 成功导入并转换一个 `.mid` 文件后，在播放列表中点击该曲目，无需任何弹窗，主窗口内「🎼 铺面编辑」标签页立即显示覆盖 88
      键范围的钢琴铺面，已有音符按正确的音高（纵轴）与起始时间/时长（横轴）渲染。"
    result: passed
    reason:
      text: 选中曲目后铺面切换显示，音符矩形位置=start*70/(108-pitch)*10，渲染正确。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 在铺面中拖动一个可映射音符改变其音高和起始时间，点击保存后，重新查看该曲目的
      `play_code/*.json`，`playback_data` 反映了修改后的音高对应按键与新的时间间隔。"
    result: passed
    reason:
      text: 移动音高与起始时间并保存后，playback_data 反映新按键与新时间间隔（['W', 2.0, 'E']）。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 在铺面中拖动一个音符的右边缘缩短/延长其时长，铺面上矩形宽度相应变化（可视化/编辑辅助）；保存后 `playback_data`
      不因该时长调整而改变（游戏按键回放是点按模型，时长不改变按键与延迟），与调整前保持一致。"
    result: passed
    reason:
      text: 仅修改 duration（0.5→9.0）并保存，playback_data 与修改前基线完全一致（['Q', 1.0,
        'W']）；regenerate_playback_from_notes 从不读取 duration 构建 playback_data，与
        brief.md 修订后的 A3 一致。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 在铺面空白处新增一个可映射音符，保存后 `playback_data` 中出现对应新按键，且
      `statistics.note_count`/`key_count` 相应增加。"
    result: passed
    reason:
      text: 新增可映射音符并保存后 playback_data 出现对应按键，note_count/key_count 各 +1。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 选中一个已存在的音符并删除，保存后 `playback_data` 不再包含该音符对应按键，其余音符时间关系保持正确。"
    result: passed
    reason:
      text: 删除音符并保存后对应按键消失，其余按键保持。
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: 将一个音符拖动到映射范围之外（如超出约 4 个八度的可映射区间），铺面上以区别于可映射音符的样式显示；保存后该音符不出现在生成的
      `playback_data` 中（与现有静默跳过一致）。"
    result: passed
    reason:
      text: "拖动到映射范围外 mapped=False，视觉样式区分（#7F8C8D/#E59866 vs #58D68D/#F5B041）；保存后未出现在
        playback_data 中。"
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: 对一个由旧版本（不含结构化音符列表字段）生成的 `play_code/*.json`
      在播放列表中点击选中，铺面区域给出明确提示（需要重新导入该 MIDI 才能编辑），不会崩溃或产生错误数据。"
    result: passed
    reason:
      text: 缺少 notes 字段的文件被选中时切换到提示文案，Save 禁用，无异常。
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: 铺面存在未保存的修改时切换选中到另一个曲目，或尝试关闭程序，工具会提示用户确认是否放弃未保存的更改。"
    result: passed
    reason:
      text: 存在未保存修改时切换曲目/关闭窗口触发确认框，取消后选中项与 dirty 状态回退/保留。
      truncated: false
  - id: A9
    source: brief.md
    text: "A9:
      点击▶️播放开始播放某曲目，且铺面区域当前显示的正是该曲目时，铺面上出现随实际播放耗时移动的播放线；播放正常结束或被手动停止后，播放线消失或复位。"
    result: passed
    reason:
      text: 播放线基于 time.time() 实际耗时；仅当显示曲目与播放曲目一致时显示，停止/结束后清除。
      truncated: false
  - id: A10
    source: brief.md
    text: "A10: 播放进行中，铺面的新增/删除/拖动/调整时长交互被禁用；播放结束或停止后恢复可用。"
    result: passed
    reason:
      text: 播放期间 set_read_only(True) 阻止所有编辑交互；停止/结束后恢复。
      truncated: false
