              full.design.handoff:
                handoffContext: docs/openspec/changes/piano-roll-tempo-control/.comet/handoff/design-context.json
                handoffHash: 4de45177c53e6ea74decef5e129db2a3020447ec77f4196c3e5fb0fe5b3214ec
                proposal: 方案：1) 以「缩放秒数」实现速度变更：factor = 旧BPM / 新BPM；piano_roll 新增
                  rescale_times(factor)，缩放全部音符 start/duration
                  与播放辅助线锚点/显示位置（钳制不小于 0），重排图元、扩展场景宽度并发出 notesChanged；duration
                  不做最小钳制以保持拍长比例。2) 工具栏在「量化」旁新增 QDoubleSpinBox：范围
                  20.0～300.0，一位小数，步进 1，keyboardTracking(False)，回车或失焦才提交；导入时用
                  get_tempo_and_time_signature 的 BPM 回填，_updating_bpm
                  保护位避免回填触发重算；播放中与无曲目通过 _set_range_controls_enabled 禁用。3)
                  变更处理固定顺序：算 factor → rescale_times →
                  set_measure_grid(60/新BPM*每小节拍数) → set_beat_grid(60/新BPM,
                  每小节拍数) → _apply_quantize_grid → 更新 current_bpm →
                  标记未保存；播放中直接返回。4) 播放链路不改：播放数据仍由音符秒数生成，BPM 变大时同一乐句更快；辅助线按同一
                  factor 缩放，粘贴锚点与播放起点保持同一拍位。5) 导出写回当前
                  BPM：write_notes_to_midi(source, notes, processed_tracks,
                  output_path, tempo_bpm=None)，提供时把文件中所有 set_tempo 统一改为
                  round(60_000_000/bpm)（无 tempo 事件则在 0 号音轨 time=0 插入），秒数转 tick
                  使用新 tempo，使 tick = beats * tpb 保持不变；未处理音轨事件与 tick
                  数据原样保留。关键取舍：不新增 beat
                  字段（需改所有编辑/播放/导出路径）；不只改网格（播放速度不变）；不只缩放播放延迟（铺面与进度错位）；导出不改 tick
                  而改 tempo 才能让文件速度与铺面一致；多段 tempo 源文件按基础 tempo 统一处理并声明为已知限制。风险：多段
                  tempo 被拉平；长时间连续调 BPM 的浮点漂移（1e-6
                  容差验收）；大曲目重排性能（与缩放重排同量级）；误触（键盘跟踪关闭 + 播放中禁用）。测试策略：纯函数
                  bpm_scale_factor / tempo_us_from_bpm / scaled_note_times；画布
                  rescale_times 与可逆性；用 mido 构造 120 BPM 两音轨 MIDI 导出 90 BPM 断言
                  tempo 与 tick；上一轮 51 项测试回归。Spec Patch：无。
                requirementsEvidence:
                  contentHash: ef6645e72613f474021d698362c5c79fd350b1ba858e3dd657155b70e20f1264
                  ref: docs/openspec/changes/piano-roll-tempo-control
